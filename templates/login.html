{% extends 'base.html' %}

{% block content %}
<!--
  MediGuide AI - User Login Template (login.html)
  -----------------------------------------------
  Purpose: Secure user authentication and sign-in interface.
-->
<section class="py-5">
    <div class="container py-4">
        <!-- Breadcrumb Navigation -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('index') }}" class="text-decoration-none">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Login</li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    <!-- Title & Header -->
                    <div class="text-center mb-4">
                        <div class="brand-icon mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 56px; height: 56px; font-size: 1.6rem; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #0d9488); color: white;">
                            <i class="bi bi-box-arrow-in-right"></i>
                        </div>
                        <h2 class="fw-bold">Welcome Back</h2>
                        <p class="text-secondary small">Sign in to access your MediGuide AI account</p>
                    </div>

                    <!-- Functional Login Form -->
                    <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control bg-light border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="password" class="form-label fw-semibold mb-0">Password</label>
                            </div>
                            <div class="input-group mt-1">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control bg-light border-start-0" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember" value="true">
                            <label class="form-check-label small text-secondary" for="remember">Remember me on this device</label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 fw-semibold mb-3 shadow-sm">
                            Sign In <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="small text-secondary mb-0">
                            Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-primary text-decoration-none">Create Account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
