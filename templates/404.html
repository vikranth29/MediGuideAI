{% extends 'base.html' %}

{% block content %}
<section class="py-5 my-auto text-center">
    <div class="container py-5">
        <div class="display-1 fw-bold text-primary mb-2">404</div>
        <h2 class="fw-bold mb-3">Page Not Found</h2>
        <p class="text-secondary mb-4 max-w-500 mx-auto">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-gradient-primary rounded-pill px-4 py-2">
            <i class="bi bi-house-door me-2"></i> Return to Homepage
        </a>
    </div>
</section>
{% endblock %}
