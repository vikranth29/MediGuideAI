# =============================================================================
# MediGuide AI – flake8 configuration
# =============================================================================
# flake8 reads this file automatically when run from the project root.
# Keeps linter settings in version control so CI and local dev stay in sync.
# =============================================================================

[flake8]
# Maximum line length – 120 gives room for longer docstrings and SQL strings
# without forcing unnecessary line-continuation backslashes everywhere.
max-line-length = 120

# Directories and files to skip entirely
exclude =
    .git,
    __pycache__,
    venv,
    env,
    ENV,
    .venv,
    build,
    dist,
    *.egg-info,
    migrations,
    datasets,
    ml_model,
    backend,
    frontend,
    .github

# Error / warning codes to ignore project-wide:
#   E203  – whitespace before ':' (conflicts with Black-style slice formatting)
#   E221  – multiple spaces before operator (project uses alignment style)
#   E251  – spaces around keyword '=' (project uses alignment style)
#   W503  – line break before binary operator (PEP 8 now allows both styles)
#   W504  – line break after binary operator (complementary to W503)
#   W292  – no newline at end of file (auto-fixed by most editors)
extend-ignore = E203, E221, E251, W292, W503, W504

# Per-file ignores for patterns that are intentional or structural:
per-file-ignores =
    # app.py: lazy User re-imports inside routes (F811), module-level imports
    # after extension init (E402), extra blank lines from code generation
    # (E302, E303), and unused form fields stored for future use (F841).
    app.py: E501, E402, E302, E303, F811, F841
    # config.py may have long value strings and no trailing newline
    config.py: E501
    # hospital_service.py and report_analyzer_service.py have long Overpass QL
    # query strings that cannot reasonably be broken across lines.
    services/hospital_service.py: E501, F841
    services/report_analyzer_service.py: E501
    routes/hospital_routes.py: E501
    # Test files: allow long assertion lines and unused imports
    tests/*.py: E501, F401
